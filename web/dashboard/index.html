<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>M.U.S.E. Dashboard</title>
    <!-- Theme & Layout -->
    <link rel="stylesheet" href="styles/theme.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/lyrics.css">
    <link rel="stylesheet" href="styles/controls.css">
    <link rel="stylesheet" href="styles/adaptive.css">
</head>
<body>
    <div class="container">
        <div class="player-card">
            <!-- Lyrics at the top -->
            <div class="lyrics-container" id="lyrics-container">
                <div class="lyrics-track" id="lyrics-track">
                    <p class="lyric-line active">Lyrics will appear here</p>
                </div>
            </div>
            
            <!-- Progress in the middle -->
            <div class="progress-section">
                <div class="progress-container">
                    <div class="progress-bar tappable" id="progress-bar">
                        <div class="progress-fill" id="progress-fill"></div>
                    </div>
                    <div class="time-info">
                        <span id="current-time">0:00</span>
                        <span id="total-time">0:00</span>
                    </div>
                </div>
            </div>

            <!-- Bottom bar: Art + Info + Space + Controls -->
            <div class="bottom-bar">
                <div class="header-section">
                    <div class="album-art" id="art">♫</div>
                    <div class="track-info">
                        <h1 id="title">No Track Playing</h1>
                        <p id="subtitle">Select a file</p>
                    </div>
                </div>
                <div class="spacer"></div>
                <div class="controls">
                    <button class="btn tappable" id="prev-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/></svg>
                    </button>
                    <button class="btn btn-play tappable" id="play-btn">
                        <svg id="play-icon" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
                    </button>
                    <button class="btn tappable" id="next-btn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts: Feature-first approach -->
    <script src="scripts/bridge.js"></script>
    <script src="scripts/lyrics.js"></script>
    <script src="scripts/playback.js"></script>
    <script src="scripts/main.js"></script>
</body>
</html>
